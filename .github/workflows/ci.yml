name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Determine contributor trust level
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Evaluate author association
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Direct pushes (e.g. to main) are already gated by repo push access, not a PR.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Re-fetch association live rather than trusting the webhook payload's
          # author_association snapshot, which can be stale (observed as NONE for an actual
          # org MEMBER on this repo) — see docs/development/ci.md for the incident this fixed.
          ASSOCIATION=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .author_association)
          echo "Live author_association: $ASSOCIATION"
          # OWNER/MEMBER/COLLABORATOR: repo access already implies trust.
          # CONTRIBUTOR: has a prior merged PR here, per AGENTS.md's spirit of proportional trust.
          # Everyone else (FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, NONE, MANNEQUIN) needs review.
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR)
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  await-maintainer-approval:
    name: Await maintainer approval (non-contributor PR)
    needs: authorize
    if: needs.authorize.outputs.trusted == 'false'
    runs-on: ubuntu-latest
    # Gated by the "external-contribution-review" environment's required reviewers — the job
    # pauses in "Waiting" state until a maintainer approves the run from the Actions tab.
    environment: external-contribution-review
    steps:
      - name: Approved
        run: echo "A maintainer approved this run — proceeding to CI."

  validate:
    name: setup, validate, lint, test, docs
    needs: [authorize, await-maintainer-approval]
    if: ${{ always() && (needs.authorize.outputs.trusted == 'true' || needs.await-maintainer-approval.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node (for optional markdown linting)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: make setup
        run: make setup

      - name: make validate
        run: make validate

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: make docs
        run: make docs
