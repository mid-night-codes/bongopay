name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  authorize:
    name: Determine contributor trust level
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Evaluate trust level
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Direct pushes (e.g. to main) are already gated by repo push access, not a PR.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A PR from a branch in *this* repo (not a fork) requires push access to have
          # created that branch in the first place — trust it without further checks. This is
          # more robust than GitHub's author_association, which was observed returning NONE
          # for an actual org MEMBER (privacy-dependent — see docs/development/ci.md for the
          # incident) rather than a reliable signal.
          if [ "$IS_FORK" != "true" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fork PR: trust it only if this author already has a merged PR in this repo —
          # mirrors GitHub's own CONTRIBUTOR vs. FIRST_TIME_CONTRIBUTOR distinction, computed
          # from public merged-PR history rather than a privacy-sensitive association field.
          MERGED_COUNT=$(gh api "search/issues?q=repo:${REPO}+type:pr+is:merged+author:${AUTHOR}" --jq '.total_count')
          echo "Merged PRs by $AUTHOR in $REPO: $MERGED_COUNT"
          if [ "$MERGED_COUNT" -gt 0 ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

  await-maintainer-approval:
    name: Await maintainer approval (non-contributor PR)
    needs: authorize
    if: needs.authorize.outputs.trusted == 'false'
    runs-on: ubuntu-latest
    # Gated by the "external-contribution-review" environment's required reviewers — the job
    # pauses in "Waiting" state until a maintainer approves the run from the Actions tab.
    environment: external-contribution-review
    steps:
      - name: Approved
        run: echo "A maintainer approved this run — proceeding to CI."

  validate:
    name: setup, validate, lint, test, docs
    needs: [authorize, await-maintainer-approval]
    if: ${{ always() && (needs.authorize.outputs.trusted == 'true' || needs.await-maintainer-approval.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node (for optional markdown linting)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: make setup
        run: make setup

      - name: make validate
        run: make validate

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: make docs
        run: make docs

  go:
    name: Go build, vet, test, fmt (implementations/reference)
    needs: [authorize, await-maintainer-approval]
    if: ${{ always() && (needs.authorize.outputs.trusted == 'true' || needs.await-maintainer-approval.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/reference
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: implementations/reference/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt would reformat the following files — run 'gofmt -w .' locally:"
            echo "$fmt_out"
            exit 1
          fi
